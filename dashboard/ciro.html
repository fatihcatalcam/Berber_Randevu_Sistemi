<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#075E54" />
<title>Ciro - Resul Tabu Saç Atölyesi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --yesil1: #075E54; --yesil2: #25D366;
    --bg: #f0f2f5; --kart: #ffffff;
    --metin: #1f2937; --soluk: #6b7280; --cizgi: #e5e7eb;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--metin);
    padding-bottom: max(40px, env(safe-area-inset-bottom, 40px));
    -webkit-text-size-adjust: 100%;
  }
  button, input { touch-action: manipulation; }

  /* --- Şifre ekranı --- */
  .login-overlay {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #075E54 0%, #128C7E 100%);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
  }
  .login-kart {
    background: #fff; border-radius: 20px; padding: 26px 22px;
    max-width: 360px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .login-kart .kilit { font-size: 34px; margin-bottom: 6px; }
  .login-kart h2 { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
  .login-kart .alt { font-size: 13px; color: var(--soluk); margin-bottom: 16px; }
  #pinInput {
    width: 100%; padding: 14px; border: 1px solid var(--cizgi); border-radius: 10px;
    font-size: 20px; text-align: center; letter-spacing: 6px; margin-bottom: 8px;
    outline: none;
  }
  #pinInput:focus { border-color: var(--yesil2); }
  #pinHata { color: #dc2626; font-size: 13px; margin-bottom: 10px; min-height: 18px; }
  .btn {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: var(--yesil1); color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; min-height: 46px;
  }
  .btn:active { opacity: .8; }
  .geri-link { display: block; margin-top: 14px; font-size: 13px; color: var(--soluk); text-decoration: none; }

  /* --- Header --- */
  header {
    background: linear-gradient(135deg, #075E54 0%, #25D366 100%);
    color: #fff; padding: max(14px, calc(10px + env(safe-area-inset-top, 0px))) 16px 14px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); flex-wrap: wrap; gap: 8px;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  header a { color: #fff; opacity: .9; font-size: 13px; font-weight: 600; text-decoration: none; }
  .header-sag { display: flex; align-items: center; gap: 14px; }
  #sheetsBtn {
    display: none; padding: 7px 12px; border: 1px solid rgba(255,255,255,.4); border-radius: 8px;
    background: rgba(255,255,255,.12); opacity: 1;
  }

  .wrap { max-width: 900px; margin: 0 auto; padding: 16px 12px; }
  .kart { background: var(--kart); border-radius: 12px; border: 1px solid var(--cizgi); box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow: hidden; margin-bottom: 14px; }
  .kart-baslik { padding: 12px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid var(--cizgi); background: #f9fafb; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  .gun-nav { display: flex; align-items: center; gap: 8px; }
  .gun-nav button {
    padding: 8px 12px; border: 1px solid var(--cizgi); background: #fff; border-radius: 8px;
    cursor: pointer; font-size: 14px; font-weight: 700; min-height: 38px;
  }
  .gun-nav button:active { background: #f3f4f6; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: #f9fafb; text-align: left; padding: 10px 12px; font-size: 11px;
    text-transform: uppercase; letter-spacing: .4px; color: var(--soluk); border-bottom: 1px solid var(--cizgi);
  }
  tbody td { padding: 11px 12px; font-size: 13.5px; border-bottom: 1px solid #f3f4f6; }
  tbody tr:last-child td { border-bottom: none; }

  .durum-btn {
    padding: 9px 12px; border: 1px solid var(--cizgi); background: #fff;
    border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
    color: var(--soluk); min-height: 40px;
  }
  .durum-btn:active { opacity: .7; }
  .durum-btn.aktif { background: var(--yesil1); color: #fff; border-color: var(--yesil1); }

  .yukleniyor { text-align: center; color: var(--soluk); padding: 30px; font-size: 14px; }
  td.patron-odeme { color: var(--soluk); font-weight: 400; }

  /* --- Net kazanç özetleri --- */
  .baslik-alt { font-size: 12.5px; font-weight: 600; color: var(--soluk); }
  .ozet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .ozet-grid .kart { margin-bottom: 14px; }
  .ozet { padding: 6px 14px 12px; }
  .ozet-satir { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; font-size: 14px; border-bottom: 1px solid #f3f4f6; }
  .ozet-satir span:last-child { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ozet-satir.ara { font-weight: 700; }
  .ozet-satir.arti span:last-child { color: #059669; }
  .ozet-satir.eksi span:last-child { color: #dc2626; }
  .ozet-satir.genel { border-bottom: none; padding-top: 10px; font-size: 16px; font-weight: 800; }
  .ozet-satir.genel span:last-child { color: var(--yesil1); font-size: 19px; }
  .ozet-satir.genel.zarar span:last-child { color: #dc2626; }
  .ozet-ipucu { font-size: 12px; color: var(--soluk); padding: 2px 0 4px; }

  /* --- Ekstra gelir / gider --- */
  .kasa-form { display: grid; grid-template-columns: auto 1fr 120px auto; gap: 8px; padding: 12px 14px 4px; align-items: center; }
  .tur-sec { display: flex; gap: 6px; }
  .kasa-form input {
    padding: 10px 12px; border: 1px solid var(--cizgi); border-radius: 8px; font-size: 15px;
    min-height: 42px; width: 100%; outline: none; font-family: inherit;
  }
  .kasa-form input:focus { border-color: var(--yesil2); }
  .kasa-form .btn { width: auto; padding: 10px 18px; min-height: 42px; }
  #turGider.aktif { background: #dc2626; border-color: #dc2626; }
  #kasaHata { color: #dc2626; font-size: 13px; padding: 0 14px; min-height: 4px; }
  .kasa-satir { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid #f3f4f6; font-size: 14px; }
  .kasa-satir .k-ad { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .kasa-satir .k-tarih { color: var(--soluk); font-size: 12.5px; white-space: nowrap; }
  .kasa-satir .k-tutar { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .kasa-satir.gelir .k-tutar { color: #059669; }
  .kasa-satir.gider .k-tutar { color: #dc2626; }
  .kasa-sil { border: none; background: none; cursor: pointer; font-size: 16px; padding: 6px; border-radius: 6px; min-width: 36px; min-height: 36px; }
  .kasa-sil:active { background: #fee2e2; }
  .kasa-bos { padding: 10px 14px 12px; color: var(--soluk); font-size: 13px; }
  .kasa-ay { border-top: 1px solid var(--cizgi); }
  .kasa-ay summary { padding: 11px 14px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--soluk); }

  @media (max-width: 640px) {
    .ozet-grid { grid-template-columns: 1fr; gap: 0; }
    .kasa-form { grid-template-columns: 1fr 1fr; }
    .tur-sec { grid-column: 1 / -1; }
    .tur-sec .durum-btn { flex: 1; }
    #kasaAd { grid-column: 1 / -1; }
    .kasa-form .btn { width: 100%; }
    thead th { padding: 9px 6px; font-size: 10px; letter-spacing: 0; }
    tbody td { padding: 10px 6px; font-size: 12.5px; }
    thead th:first-child, tbody td:first-child { padding-left: 12px; }
    thead th:last-child, tbody td:last-child { padding-right: 12px; }
  }
</style>
</head>
<body>

<div class="login-overlay" id="loginEkrani">
  <div class="login-kart">
    <div class="kilit">🔒</div>
    <h2>Ciro Görüntüleme</h2>
    <div class="alt">Devam etmek için ciro şifresini girin</div>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••">
    <div id="pinHata"></div>
    <button class="btn" onclick="girisYap()">Giriş</button>
    <a class="geri-link" href="/dashboard">‹ Panele dön</a>
  </div>
</div>

<div id="icerik" style="display:none;">
  <header>
    <h1>💰 Ciro</h1>
    <div class="header-sag">
      <a id="sheetsBtn" href="#" target="_blank" rel="noopener">📊 Sheets</a>
      <a href="/dashboard">‹ Panele dön</a>
    </div>
  </header>

  <div class="wrap">
    <div class="kart">
      <div class="kart-baslik">
        <span>📅 <span id="gunBaslik"></span> — Berber Bazlı Ciro</span>
        <div class="gun-nav">
          <button onclick="gunDegistir(-1)">‹</button>
          <button onclick="gunBugun()">Bugün</button>
          <button onclick="gunDegistir(1)">›</button>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>Berber</th><th style="text-align:right;">Randevu</th><th style="text-align:right;">Ciro</th><th style="text-align:right;">Net Ödeme</th><th style="text-align:right;">Dükkâna Kalan</th></tr>
        </thead>
        <tbody id="ciroGovde"><tr><td colspan="5" class="yukleniyor">Yükleniyor…</td></tr></tbody>
      </table>
    </div>

    <!-- Net kazanç: patronun kendi cirosu + ustalardan kalan pay + ekstra gelir − gider -->
    <div class="ozet-grid">
      <div class="kart">
        <div class="kart-baslik"><span>📊 Günlük Net Kazanç</span><span class="baslik-alt" id="gunOzetBaslik"></span></div>
        <div class="ozet" id="gunOzet"></div>
      </div>
      <div class="kart">
        <div class="kart-baslik"><span>🗓️ Aylık Net Kazanç</span><span class="baslik-alt" id="ayOzetBaslik"></span></div>
        <div class="ozet" id="ayOzet"></div>
      </div>
    </div>

    <div class="kart">
      <div class="kart-baslik"><span>🧾 Ekstra Gelir / Gider</span><span class="baslik-alt" id="kasaBaslik"></span></div>
      <div class="kasa-form">
        <div class="tur-sec">
          <button type="button" id="turGelir" class="durum-btn aktif" onclick="turSec('gelir')">＋ Gelir</button>
          <button type="button" id="turGider" class="durum-btn" onclick="turSec('gider')">− Gider</button>
        </div>
        <input id="kasaAd" maxlength="60" placeholder="Açıklama (ör. Wax satışı)" autocomplete="off">
        <input id="kasaTutar" type="number" inputmode="numeric" min="1" step="1" placeholder="Tutar ₺">
        <button type="button" class="btn" id="kasaEkleBtn" onclick="kasaEkle()">Ekle</button>
      </div>
      <div id="kasaHata"></div>
      <div id="kasaGunListe"></div>
      <details class="kasa-ay">
        <summary id="kasaAyOzet">Bu ayın tüm kayıtları</summary>
        <div id="kasaAyListe"></div>
      </details>
    </div>

    <div class="kart">
      <div class="kart-baslik">
        <span>📈 Ciro Grafiği</span>
        <div style="display:flex;gap:6px;">
          <button id="grafikHaftaBtn" class="durum-btn aktif" onclick="grafikModuDegistir('hafta')">Son 7 Gün</button>
          <button id="grafikAyBtn" class="durum-btn" onclick="grafikModuDegistir('ay')">Son 6 Ay</button>
        </div>
      </div>
      <div style="padding:14px;">
        <div id="ciroGrafik" style="display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:18px;overflow-x:auto;"></div>
        <div id="ciroGrafikToplam" style="text-align:right;font-size:13px;color:var(--soluk);margin-top:8px;"></div>
      </div>
    </div>
  </div>
</div>

<script>
// Token sadece bellekte tutulur (localStorage'a YAZILMAZ) — bu sayfaya her
// girişte, ana panelin 24 saatlik oturumu açık olsa bile şifre yeniden
// sorulur. Amaç: parayla ilgili rakamlar tek tıkla görünmesin.
let token = null;
let BERBERLER = [];
let randevular = [];
let seciliTarih = bugunStr();
let grafikModu = "hafta";

function bugunStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function kacis(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

// Berberin net ödemesi: (ciro - taban) * oran — src/config.js'teki
// berberNet ile aynı formül, her berberin config'te tanımlı kendi oranı.
function berberNet(berber, ciro) {
  const n = berber.net || { taban: 0, oran: 1 };
  const net = (ciro - n.taban) * n.oran;
  return net > 0 ? Math.round(net) : 0;
}

document.getElementById("pinInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") girisYap();
});

async function girisYap() {
  const pin = document.getElementById("pinInput").value;
  const hataEl = document.getElementById("pinHata");
  hataEl.textContent = "";
  try {
    const res = await fetch("/api/auth", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ciro: true, pin }),
    });
    const data = await res.json();
    if (!data.ok || data.role !== "ciro") {
      hataEl.textContent = data.hata || "Yanlış şifre.";
      return;
    }
    token = data.token;
    document.getElementById("loginEkrani").style.display = "none";
    document.getElementById("icerik").style.display = "block";
    await veriYukle();
    sheetsButonuYukle();
  } catch (e) {
    hataEl.textContent = "Sunucu hatası.";
  }
}

async function veriYukle() {
  try {
    const [cfgRes, randRes] = await Promise.all([
      fetch("/api/config"),
      fetch("/api/randevular", { headers: { Authorization: "Bearer " + token }, cache: "no-store" }),
    ]);
    const cfg = await cfgRes.json();
    BERBERLER = cfg.berberler;
    if (!randRes.ok) throw new Error("HTTP " + randRes.status);
    randevular = await randRes.json();
    if (!Array.isArray(randevular)) throw new Error("Beklenmeyen yanıt");
    ciroRender();
  } catch (e) {
    document.getElementById("ciroGovde").innerHTML =
      `<tr><td colspan="5" class="yukleniyor">⚠️ Veriler alınamadı (${(e && e.message) || e}). Sayfayı yenileyin.</td></tr>`;
  }
}

function sheetsButonuYukle() {
  const btn = document.getElementById("sheetsBtn");
  btn.href = "https://docs.google.com/spreadsheets/d/161oVnKcrn8dHUJusZlp4AMgIzSWNmoaY_wtQOtZQZuk/edit?gid=0#gid=0";
  btn.style.display = "inline-block";
}

function gunDegistir(delta) {
  const d = new Date(seciliTarih + "T00:00:00");
  d.setDate(d.getDate() + delta);
  seciliTarih = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  ciroRender();
}
function gunBugun() { seciliTarih = bugunStr(); ciroRender(); }

const tl = (n) => n.toLocaleString("tr-TR") + "₺";
const tarihStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

// Bir günün usta usta hesabı. Ustanın net ödemesi günlük formülle (taban günlük
// düşülür) hesaplanır; cirodan kalanı dükkânın. Patronun (admin) cirosunun hepsi dükkânın.
function gunHesabi(tarih) {
  const gunRand = randevular.filter((r) => r.tarih === tarih && r.durum === "onaylı");
  return BERBERLER.map((b) => {
    const bRand = gunRand.filter((r) => r.berberId === b.id);
    const ciro = bRand.reduce((s, r) => s + (r.gercekFiyat ?? r.fiyat ?? 0), 0);
    const odeme = b.admin ? 0 : berberNet(b, ciro);
    return { b, sayi: bRand.length, ciro, odeme, kalan: ciro - odeme };
  });
}

// Dönem özeti: net kazanç = patronun kendi cirosu + ustalardan kalan + ekstra gelir − gider.
// kasa null ise (yüklenemedi/yükleniyor) gelir/gider bilinmiyor demektir.
function donemOzeti(tarihler, kasa) {
  const o = { ciro: 0, odeme: 0, patronCiro: 0, ustaKalan: 0 };
  for (const t of tarihler) {
    for (const s of gunHesabi(t)) {
      o.ciro += s.ciro; o.odeme += s.odeme;
      if (s.b.admin) o.patronCiro += s.ciro; else o.ustaKalan += s.kalan;
    }
  }
  o.hizmetNet = o.patronCiro + o.ustaKalan;
  if (kasa) {
    o.gelir = kasa.filter((k) => k.tur === "gelir").reduce((s, k) => s + k.tutar, 0);
    o.gider = kasa.filter((k) => k.tur === "gider").reduce((s, k) => s + k.tutar, 0);
    o.genelNet = o.hizmetNet + o.gelir - o.gider;
  }
  return o;
}

function ozetHtml(o) {
  const patron = BERBERLER.find((b) => b.admin);
  const bilinmiyor = '<span style="color:var(--soluk);font-weight:400;">…</span>';
  return `
    <div class="ozet-ipucu">Toplam ciro ${tl(o.ciro)} · Ustalara ödenen ${tl(o.odeme)}</div>
    <div class="ozet-satir"><span>${kacis(patron ? patron.ad : "Patron")} (kendi cirosu)</span><span>${tl(o.patronCiro)}</span></div>
    <div class="ozet-satir"><span>Ustalardan kalan</span><span>${tl(o.ustaKalan)}</span></div>
    <div class="ozet-satir ara"><span>Hizmet net kazancı</span><span>${tl(o.hizmetNet)}</span></div>
    <div class="ozet-satir arti"><span>＋ Ekstra gelir</span>${o.gelir == null ? bilinmiyor : `<span>${tl(o.gelir)}</span>`}</div>
    <div class="ozet-satir eksi"><span>− Gider</span>${o.gider == null ? bilinmiyor : `<span>${tl(o.gider)}</span>`}</div>
    <div class="ozet-satir genel${o.genelNet < 0 ? " zarar" : ""}"><span>Genel Net Kazanç</span>${o.genelNet == null ? bilinmiyor : `<span>${tl(o.genelNet)}</span>`}</div>`;
}

function ciroRender() {
  const gunLabel = new Date(seciliTarih + "T00:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
  document.getElementById("gunBaslik").textContent = gunLabel;

  const govde = document.getElementById("ciroGovde");
  govde.innerHTML = "";
  let toplamCiro = 0, toplamSayi = 0, toplamOdeme = 0, toplamKalan = 0;

  gunHesabi(seciliTarih).forEach((s) => {
    if (s.b.ayrildi && !s.sayi) return; // ayrılan usta sadece randevusu olan günde
    toplamCiro += s.ciro; toplamSayi += s.sayi; toplamOdeme += s.odeme; toplamKalan += s.kalan;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${kacis(s.b.ad)}</td>
      <td style="text-align:right;">${s.sayi}</td>
      <td style="text-align:right;font-weight:700;color:#059669;">${tl(s.ciro)}</td>
      ${s.b.admin
        ? `<td style="text-align:right;" class="patron-odeme" title="Patron: cirosu dükkâna kalır">—</td>`
        : `<td style="text-align:right;font-weight:700;color:#2563eb;">${tl(s.odeme)}</td>`}
      <td style="text-align:right;font-weight:700;color:#7c3aed;">${tl(s.kalan)}</td>`;
    govde.appendChild(tr);
  });

  const tot = document.createElement("tr");
  tot.style.cssText = "border-top:2px solid var(--cizgi);font-weight:800;background:#f9fafb;";
  tot.innerHTML = `
    <td>Toplam</td>
    <td style="text-align:right;">${toplamSayi}</td>
    <td style="text-align:right;color:#075E54;">${tl(toplamCiro)}</td>
    <td style="text-align:right;color:#1d4ed8;">${tl(toplamOdeme)}</td>
    <td style="text-align:right;color:#6d28d9;">${tl(toplamKalan)}</td>`;
  govde.appendChild(tot);

  ozetleriRender();
  ciroGrafikRender();
}

// ---------------------------------------------------------------------------
// Günlük / aylık net kazanç ve kasa defteri (ekstra gelir / gider)
// ---------------------------------------------------------------------------
const kasaAylar = {};       // "YYYY-AA" → kayıtlar (yüklenince)
const kasaYukleniyor = {};  // aynı ay iki kez istenmesin
const kasaHatali = {};      // yüklenemeyen ay (otomatik tekrar denenmez)
let kasaTur = "gelir";

const seciliAy = () => seciliTarih.slice(0, 7);

async function kasaYukle(ay) {
  if (kasaYukleniyor[ay]) return;
  kasaYukleniyor[ay] = true;
  try {
    const res = await fetch("/api/kasa?ay=" + ay, { headers: { Authorization: "Bearer " + token }, cache: "no-store" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.hata || "HTTP " + res.status);
    kasaAylar[ay] = data;
    document.getElementById("kasaHata").textContent = "";
    if (ay === seciliAy()) ozetleriRender();
  } catch (e) {
    // Yeniden denemek için sayfa yenilenir (her çizimde tekrar istenirse döngüye girer)
    kasaHatali[ay] = true;
    document.getElementById("kasaHata").textContent = "⚠️ Gelir/gider kayıtları alınamadı (" + ((e && e.message) || e) + "). Sayfayı yenileyin.";
  } finally {
    kasaYukleniyor[ay] = false;
  }
}

function ozetleriRender() {
  const ay = seciliAy();
  const kasa = kasaAylar[ay] || null;
  if (!kasa && !kasaHatali[ay]) kasaYukle(ay);

  const gunEtiket = new Date(seciliTarih + "T00:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long" });
  const ayIlk = new Date(ay + "-01T00:00:00");
  const ayEtiket = ayIlk.toLocaleDateString("tr-TR", { month: "long", year: "numeric" });

  // Ayın günleri; içinde bulunulan ayda bugüne kadar (ileri tarihli randevular henüz ciro değil)
  const bugun = bugunStr();
  const ayGunleri = [];
  for (let d = new Date(ayIlk); d.getMonth() === ayIlk.getMonth(); d.setDate(d.getDate() + 1)) {
    const t = tarihStr(d);
    if (t > bugun) break;
    ayGunleri.push(t);
  }
  const ayDevam = bugun.startsWith(ay);

  document.getElementById("gunOzetBaslik").textContent = gunEtiket;
  document.getElementById("ayOzetBaslik").textContent = ayEtiket + (ayDevam ? " (bugüne kadar)" : "");
  document.getElementById("kasaBaslik").textContent = gunEtiket;

  const gunKasa = kasa && kasa.filter((k) => k.tarih === seciliTarih);
  const ayKasa = kasa && (ayDevam ? kasa.filter((k) => k.tarih <= bugun) : kasa);
  document.getElementById("gunOzet").innerHTML = ozetHtml(donemOzeti([seciliTarih], gunKasa));
  document.getElementById("ayOzet").innerHTML = ozetHtml(donemOzeti(ayGunleri, ayKasa));

  document.getElementById("kasaGunListe").innerHTML = !kasa
    ? '<div class="kasa-bos">Yükleniyor…</div>'
    : gunKasa.length
      ? gunKasa.map((k) => kasaSatirHtml(k, false)).join("")
      : '<div class="kasa-bos">Bu gün için kayıt yok. Ürün satışı gibi gelirleri ya da giderleri yukarıdan ekleyin.</div>';
  document.getElementById("kasaAyOzet").textContent = `${ayEtiket} — tüm kayıtlar (${kasa ? kasa.length : "…"})`;
  document.getElementById("kasaAyListe").innerHTML = kasa && kasa.length
    ? kasa.map((k) => kasaSatirHtml(k, true)).join("")
    : '<div class="kasa-bos">Bu ay kayıt yok.</div>';
}

function kasaSatirHtml(k, tarihli) {
  const tarih = new Date(k.tarih + "T00:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "short" });
  return `<div class="kasa-satir ${k.tur}">
    ${tarihli ? `<span class="k-tarih">${tarih}</span>` : ""}
    <span class="k-ad">${k.tur === "gelir" ? "＋" : "−"} ${kacis(k.ad)}</span>
    <span class="k-tutar">${k.tur === "gelir" ? "" : "−"}${tl(k.tutar)}</span>
    <button type="button" class="kasa-sil" title="Sil" aria-label="${kacis(k.ad)} kaydını sil" onclick="kasaSil('${k.id}')">🗑️</button>
  </div>`;
}

function turSec(tur) {
  kasaTur = tur;
  document.getElementById("turGelir").classList.toggle("aktif", tur === "gelir");
  document.getElementById("turGider").classList.toggle("aktif", tur === "gider");
  document.getElementById("kasaAd").placeholder = tur === "gelir" ? "Açıklama (ör. Wax satışı)" : "Açıklama (ör. Elektrik faturası)";
}

async function kasaEkle() {
  const adEl = document.getElementById("kasaAd"), tutarEl = document.getElementById("kasaTutar");
  const hata = document.getElementById("kasaHata");
  const ad = adEl.value.trim();
  const tutar = Number(tutarEl.value);
  if (!ad) { hata.textContent = "Açıklama yazın (ör. Wax)."; adEl.focus(); return; }
  if (!Number.isInteger(tutar) || tutar <= 0) { hata.textContent = "Tutarı tam sayı olarak yazın."; tutarEl.focus(); return; }
  const btn = document.getElementById("kasaEkleBtn");
  btn.disabled = true;
  try {
    const res = await fetch("/api/kasa", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ tarih: seciliTarih, tur: kasaTur, ad, tutar }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.hata || "HTTP " + res.status);
    const ay = data.tarih.slice(0, 7);
    if (kasaAylar[ay]) kasaAylar[ay].push(data);
    adEl.value = ""; tutarEl.value = ""; hata.textContent = "";
    ozetleriRender();
    adEl.focus();
  } catch (e) {
    hata.textContent = "⚠️ Eklenemedi: " + ((e && e.message) || e);
  } finally {
    btn.disabled = false;
  }
}

async function kasaSil(id) {
  const ay = seciliAy();
  const k = (kasaAylar[ay] || []).find((x) => x.id === id);
  if (!k || !confirm(`"${k.ad}" (${tl(k.tutar)}) silinsin mi?`)) return;
  const hata = document.getElementById("kasaHata");
  try {
    const res = await fetch("/api/kasa/" + encodeURIComponent(id), { method: "DELETE", headers: { Authorization: "Bearer " + token } });
    const data = await res.json();
    if (!res.ok && res.status !== 404) throw new Error(data.hata || "HTTP " + res.status);
    kasaAylar[ay] = kasaAylar[ay].filter((x) => x.id !== id);
    hata.textContent = "";
    ozetleriRender();
  } catch (e) {
    hata.textContent = "⚠️ Silinemedi: " + ((e && e.message) || e);
  }
}

["kasaAd", "kasaTutar"].forEach((id) => document.getElementById(id).addEventListener("keydown", (e) => {
  if (e.key === "Enter") kasaEkle();
}));

function grafikModuDegistir(mod) {
  grafikModu = mod;
  document.getElementById("grafikHaftaBtn").classList.toggle("aktif", mod === "hafta");
  document.getElementById("grafikAyBtn").classList.toggle("aktif", mod === "ay");
  ciroGrafikRender();
}

function ciroGrafikRender() {
  const kutu = document.getElementById("ciroGrafik");
  const onayli = randevular.filter((r) => r.durum === "onaylı");

  const kovalar = [];
  const bugun = new Date();
  if (grafikModu === "hafta") {
    for (let i = 6; i >= 0; i--) {
      const d = new Date(bugun); d.setDate(bugun.getDate() - i);
      const anahtar = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      kovalar.push({ anahtar, etiket: d.toLocaleDateString("tr-TR", { weekday: "short", day: "numeric" }), eslesir: (r) => r.tarih === anahtar });
    }
  } else {
    for (let i = 5; i >= 0; i--) {
      const d = new Date(bugun.getFullYear(), bugun.getMonth() - i, 1);
      const onek = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      kovalar.push({ anahtar: onek, etiket: d.toLocaleDateString("tr-TR", { month: "short", year: "2-digit" }), eslesir: (r) => (r.tarih || "").startsWith(onek) });
    }
  }

  const degerler = kovalar.map((k) => onayli.filter(k.eslesir).reduce((s, r) => s + (r.gercekFiyat ?? r.fiyat ?? 0), 0));
  const maks = Math.max(1, ...degerler);
  const toplam = degerler.reduce((s, v) => s + v, 0);

  kutu.innerHTML = kovalar.map((k, i) => {
    const v = degerler[i];
    const yuzde = Math.round((v / maks) * 100);
    const etiketDeger = v >= 1000 ? (v / 1000).toFixed(1).replace(".0", "") + "k" : v;
    return `<div style="flex:1;min-width:38px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;">
      <div style="font-size:10px;font-weight:700;color:#065f46;white-space:nowrap;">${v ? etiketDeger + "₺" : ""}</div>
      <div title="${v.toLocaleString("tr-TR")}₺" style="width:100%;background:linear-gradient(#34d399,#059669);border-radius:5px 5px 0 0;height:${Math.max(yuzde,2)}%;min-height:2px;"></div>
      <div style="font-size:10px;color:var(--soluk);white-space:nowrap;">${k.etiket}</div>
    </div>`;
  }).join("");

  document.getElementById("ciroGrafikToplam").textContent =
    (grafikModu === "hafta" ? "Son 7 gün" : "Son 6 ay") + " toplam: " + toplam.toLocaleString("tr-TR") + "₺";
}

setTimeout(() => document.getElementById("pinInput").focus(), 100);
</script>
</body>
