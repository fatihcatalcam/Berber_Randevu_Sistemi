<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>💈 Berber Yönetim Paneli</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --yesil1: #075E54;
    --yesil2: #25D366;
    --bg: #f0f2f5;
    --kart: #ffffff;
    --metin: #1f2937;
    --soluk: #6b7280;
    --cizgi: #e5e7eb;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--metin);
    padding-bottom: 40px;
  }

  /* Başlık */
  header {
    background: linear-gradient(135deg, #075E54 0%, #25D366 100%);
    color: #fff;
    padding: 22px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  header h1 { font-size: 24px; font-weight: 700; letter-spacing: .3px; }
  .canli { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
  .nokta {
    width: 11px; height: 11px; border-radius: 50%;
    background: #4ade80; box-shadow: 0 0 0 0 rgba(74,222,128,.7);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(74,222,128,.7); }
    70% { box-shadow: 0 0 0 9px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

  /* İstatistik kartları */
  .istatistik {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .kart {
    background: var(--kart);
    border-radius: 14px;
    padding: 18px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    border: 1px solid var(--cizgi);
  }
  .kart .sayi { font-size: 30px; font-weight: 800; line-height: 1; }
  .kart .etiket { font-size: 13px; color: var(--soluk); margin-top: 8px; font-weight: 600; }
  .kart.toplam .sayi { color: #075E54; }
  .kart.onayli .sayi { color: #059669; }
  .kart.bekliyor .sayi { color: #ca8a04; }
  .kart.iptal .sayi { color: #dc2626; }
  .kart.bekleyen .sayi { color: #2563eb; }

  /* Filtre satırı */
  .filtre {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    background: var(--kart);
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--cizgi);
    margin-bottom: 18px;
  }
  .filtre input[type="text"], .filtre select {
    padding: 9px 13px;
    border: 1px solid var(--cizgi);
    border-radius: 9px;
    font-size: 14px;
    outline: none;
    background: #fff;
  }
  .filtre input[type="text"] { flex: 1; min-width: 200px; }
  .filtre input[type="text"]:focus, .filtre select:focus { border-color: var(--yesil2); }
  .durum-btnlar { display: flex; gap: 6px; }
  .durum-btn {
    padding: 8px 14px;
    border: 1px solid var(--cizgi);
    background: #fff;
    border-radius: 9px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--soluk);
    transition: all .15s;
  }
  .durum-btn:hover { border-color: var(--yesil2); }
  .durum-btn.aktif { background: var(--yesil1); color: #fff; border-color: var(--yesil1); }

  /* Tablo */
  .tablo-kutu {
    background: var(--kart);
    border-radius: 14px;
    border: 1px solid var(--cizgi);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: #f9fafb;
    text-align: left;
    padding: 13px 16px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: var(--soluk);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    border-bottom: 1px solid var(--cizgi);
  }
  thead th:hover { color: var(--yesil1); }
  thead th .ok { font-size: 10px; opacity: .6; }
  tbody td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #f3f4f6; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafafa; }

  .badge {
    display: inline-block;
    padding: 4px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge.bekliyor { background: #fef9c3; color: #713f12; }
  .badge.onaylı   { background: #d1fae5; color: #065f46; }
  .badge.iptal    { background: #fee2e2; color: #991b1b; }

  .islem-btn {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 18px;
    padding: 3px 5px;
    border-radius: 6px;
    transition: transform .12s, background .12s;
  }
  .islem-btn:hover { transform: scale(1.2); background: #f0f0f0; }
  .islem-btn:disabled { opacity: .25; cursor: default; transform: none; background: none; }

  .flash { animation: flash 1.1s ease; }
  @keyframes flash {
    0% { background: #bbf7d0; }
    100% { background: transparent; }
  }

  .bos { text-align: center; padding: 50px 20px; color: var(--soluk); font-size: 15px; }

  footer {
    text-align: center;
    margin-top: 18px;
    color: var(--soluk);
    font-size: 13px;
  }

  @media (max-width: 760px) {
    .istatistik { grid-template-columns: repeat(2, 1fr); }
    header { flex-direction: column; gap: 10px; text-align: center; }
  }
</style>
</head>
<body>

<header>
  <h1>💈 Berber Yönetim Paneli</h1>
  <div class="canli">
    <span class="nokta"></span>
    <span id="saat">--:--:--</span>
  </div>
</header>

<div class="wrap">

  <div class="istatistik">
    <div class="kart toplam">   <div class="sayi" id="s-toplam">0</div>   <div class="etiket">Toplam</div></div>
    <div class="kart onayli">   <div class="sayi" id="s-onayli">0</div>   <div class="etiket">Onaylı</div></div>
    <div class="kart bekliyor"> <div class="sayi" id="s-bekliyor">0</div> <div class="etiket">Bekliyor</div></div>
    <div class="kart iptal">    <div class="sayi" id="s-iptal">0</div>    <div class="etiket">İptal</div></div>
    <div class="kart bekleyen"> <div class="sayi" id="s-bekleyen">0</div> <div class="etiket">Onay Bekleyen</div></div>
  </div>

  <div class="takvim-kutu" style="background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:16px;margin-bottom:18px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <button id="ayOnceki" class="durum-btn">‹</button>
      <strong id="ayBaslik" style="font-size:16px;"></strong>
      <button id="aySonraki" class="durum-btn">›</button>
    </div>
    <div id="takvimGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;"></div>
  </div>

  <div class="filtre">
    <input type="text" id="arama" placeholder="🔍 Ad veya telefon ara..." />
    <div class="durum-btnlar">
      <button class="durum-btn aktif" data-durum="hepsi">Hepsi</button>
      <button class="durum-btn" data-durum="bekliyor">Bekliyor</button>
      <button class="durum-btn" data-durum="onaylı">Onaylı</button>
      <button class="durum-btn" data-durum="iptal">İptal</button>
    </div>
    <select id="berberFiltre">
      <option value="hepsi">Tüm Berberler</option>
    </select>
  </div>

  <div class="tablo-kutu">
    <table>
      <thead>
        <tr>
          <th data-kol="ad">Ad Soyad <span class="ok"></span></th>
          <th data-kol="telefon">Telefon <span class="ok"></span></th>
          <th data-kol="berber">Berber <span class="ok"></span></th>
          <th data-kol="hizmet">Hizmet <span class="ok"></span></th>
          <th data-kol="tarih">Tarih <span class="ok"></span></th>
          <th data-kol="saat">Saat <span class="ok"></span></th>
          <th data-kol="durum">Durum <span class="ok"></span></th>
          <th>İşlem</th>
        </tr>
      </thead>
      <tbody id="govde"></tbody>
    </table>
    <div class="bos" id="bos" style="display:none;">Gösterilecek randevu yok.</div>
  </div>

  <footer id="footer">Yükleniyor...</footer>
</div>

<script>
  let randevular = [];
  let seciliTarih = (() => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  })();
  let takvimAy = new Date(); // gösterilen ay
  let filtreDurum = "hepsi";
  let filtreBerber = "hepsi";
  let arama = "";
  let siralama = { kol: "tarih", yon: "desc" };
  let oncekiDurumlar = {}; // flash tespiti için

  // --- Takvim ---
  const GUNLER = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
  function takvimRender() {
    const yil = takvimAy.getFullYear(), ay = takvimAy.getMonth();
    document.getElementById("ayBaslik").textContent =
      takvimAy.toLocaleDateString("tr-TR", { month: "long", year: "numeric" });

    const grid = document.getElementById("takvimGrid");
    grid.innerHTML = "";
    GUNLER.forEach((g) => {
      const el = document.createElement("div");
      el.textContent = g;
      el.style.cssText = "text-align:center;font-size:11px;color:var(--soluk);font-weight:700;padding:4px;";
      grid.appendChild(el);
    });

    const ilk = new Date(yil, ay, 1);
    let basOfset = (ilk.getDay() + 6) % 7;
    for (let i = 0; i < basOfset; i++) grid.appendChild(document.createElement("div"));

    const gunSayisi = new Date(yil, ay + 1, 0).getDate();
    for (let g = 1; g <= gunSayisi; g++) {
      const deger = `${yil}-${String(ay+1).padStart(2,"0")}-${String(g).padStart(2,"0")}`;
      const adet = randevular.filter((r) => r.tarih === deger && r.durum !== "iptal").length;
      const hucre = document.createElement("button");
      hucre.className = "takvim-gun";
      hucre.style.cssText =
        "position:relative;padding:10px 4px;border:1px solid var(--cizgi);border-radius:8px;background:#fff;cursor:pointer;font-size:14px;" +
        (deger === seciliTarih ? "outline:2px solid var(--yesil2);background:#ecfdf5;" : "");
      hucre.textContent = g;
      if (adet > 0) {
        const rozet = document.createElement("span");
        rozet.textContent = adet;
        rozet.style.cssText = "position:absolute;top:2px;right:4px;background:var(--yesil1);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:0 5px;";
        hucre.appendChild(rozet);
      }
      hucre.addEventListener("click", () => { seciliTarih = deger; takvimRender(); render(); cizelgeRender(); });
      grid.appendChild(hucre);
    }
  }
  document.getElementById("ayOnceki").addEventListener("click", () => { takvimAy.setMonth(takvimAy.getMonth()-1); takvimRender(); });
  document.getElementById("aySonraki").addEventListener("click", () => { takvimAy.setMonth(takvimAy.getMonth()+1); takvimRender(); });

  // --- Canlı saat ---
  function saatGuncelle() {
    const d = new Date();
    document.getElementById("saat").textContent = d.toLocaleTimeString("tr-TR");
  }
  setInterval(saatGuncelle, 1000);
  saatGuncelle();

  // --- Veri çek ---
  async function veriCek() {
    try {
      const res = await fetch("/api/randevular");
      const yeni = await res.json();
      tespitFlash(yeni);
      randevular = yeni;
      berberSecenekleriDoldur();
      takvimRender();
      render();
    } catch (e) {
      document.getElementById("footer").textContent = "⚠️ Sunucuya bağlanılamadı.";
    }
  }

  // Durumu değişen kayıtları işaretle
  let flashIdler = new Set();
  function tespitFlash(yeni) {
    flashIdler = new Set();
    yeni.forEach((r) => {
      if (oncekiDurumlar[r.id] && oncekiDurumlar[r.id] !== r.durum) {
        flashIdler.add(r.id);
      }
      oncekiDurumlar[r.id] = r.durum;
    });
  }

  function berberSecenekleriDoldur() {
    const sel = document.getElementById("berberFiltre");
    const mevcut = new Set([...sel.options].map((o) => o.value));
    const berberler = [...new Set(randevular.map((r) => r.berber))];
    berberler.forEach((b) => {
      if (!mevcut.has(b)) {
        const opt = document.createElement("option");
        opt.value = b;
        opt.textContent = b;
        sel.appendChild(opt);
      }
    });
  }

  // --- İstatistik ---
  function istatistikGuncelle() {
    const t = randevular.length;
    const onayli = randevular.filter((r) => r.durum === "onaylı").length;
    const bekliyor = randevular.filter((r) => r.durum === "bekliyor").length;
    const iptal = randevular.filter((r) => r.durum === "iptal").length;
    document.getElementById("s-toplam").textContent = t;
    document.getElementById("s-onayli").textContent = onayli;
    document.getElementById("s-bekliyor").textContent = bekliyor;
    document.getElementById("s-iptal").textContent = iptal;
    document.getElementById("s-bekleyen").textContent = bekliyor;
  }

  // --- Tarih formatı ---
  function tarihFormat(t) {
    try {
      return new Date(t + "T00:00:00").toLocaleDateString("tr-TR", {
        day: "2-digit", month: "2-digit", year: "numeric"
      });
    } catch (e) { return t; }
  }

  // --- Filtre + sıralama + render ---
  function render() {
    istatistikGuncelle();

    let liste = randevular.slice();

    if (filtreDurum !== "hepsi") liste = liste.filter((r) => r.durum === filtreDurum);
    if (filtreBerber !== "hepsi") liste = liste.filter((r) => r.berber === filtreBerber);
    if (arama.trim()) {
      const a = arama.toLowerCase();
      liste = liste.filter(
        (r) => (r.ad || "").toLowerCase().includes(a) || (r.telefon || "").includes(a)
      );
    }

    liste.sort((x, y) => {
      let vx = x[siralama.kol], vy = y[siralama.kol];
      vx = (vx === undefined || vx === null) ? "" : vx;
      vy = (vy === undefined || vy === null) ? "" : vy;
      if (vx < vy) return siralama.yon === "asc" ? -1 : 1;
      if (vx > vy) return siralama.yon === "asc" ? 1 : -1;
      return 0;
    });

    const govde = document.getElementById("govde");
    const bos = document.getElementById("bos");
    govde.innerHTML = "";

    if (liste.length === 0) {
      bos.style.display = "block";
    } else {
      bos.style.display = "none";
      liste.forEach((r) => {
        const tr = document.createElement("tr");
        if (flashIdler.has(r.id)) tr.className = "flash";
        tr.innerHTML = `
          <td><strong>${kacis(r.ad)}</strong></td>
          <td>${kacis(r.telefon)}</td>
          <td>${kacis(r.berber)}</td>
          <td>${kacis(r.hizmet)}</td>
          <td>${tarihFormat(r.tarih)}</td>
          <td>${kacis(r.saat)}</td>
          <td><span class="badge ${r.durum}">${durumYazi(r.durum)}</span></td>
          <td>
            <button class="islem-btn" title="Onayla" ${r.durum === "onaylı" ? "disabled" : ""}
              onclick="durumDegistir('${r.id}','onaylı')">✅</button>
            <button class="islem-btn" title="İptal" ${r.durum === "iptal" ? "disabled" : ""}
              onclick="durumDegistir('${r.id}','iptal')">❌</button>
            <button class="islem-btn" title="Bekliyor olarak işaretle (yerel)" disabled>⏳</button>
          </td>`;
        govde.appendChild(tr);
      });
    }

    const ts = new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("footer").textContent =
      `${liste.length} kayıt gösteriliyor / ${randevular.length} toplam • Son güncelleme: ${ts}`;
  }

  function durumYazi(d) {
    if (d === "onaylı") return "Onaylı";
    if (d === "iptal") return "İptal";
    return "Bekliyor";
  }

  function kacis(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  }

  // --- Durum değiştir ---
  async function durumDegistir(id, durum) {
    try {
      const res = await fetch(`/api/randevular/${id}/durum`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ durum }),
      });
      if (!res.ok) { alert("İşlem başarısız oldu."); return; }
      await veriCek();
    } catch (e) {
      alert("Sunucu hatası.");
    }
  }

  // --- Olay dinleyiciler ---
  document.getElementById("arama").addEventListener("input", (e) => {
    arama = e.target.value; render();
  });
  document.getElementById("berberFiltre").addEventListener("change", (e) => {
    filtreBerber = e.target.value; render();
  });
  document.querySelectorAll(".durum-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".durum-btn").forEach((b) => b.classList.remove("aktif"));
      btn.classList.add("aktif");
      filtreDurum = btn.dataset.durum;
      render();
    });
  });
  document.querySelectorAll("thead th[data-kol]").forEach((th) => {
    th.addEventListener("click", () => {
      const kol = th.dataset.kol;
      if (siralama.kol === kol) {
        siralama.yon = siralama.yon === "asc" ? "desc" : "asc";
      } else {
        siralama.kol = kol; siralama.yon = "asc";
      }
      document.querySelectorAll("thead th .ok").forEach((o) => (o.textContent = ""));
      th.querySelector(".ok").textContent = siralama.yon === "asc" ? "▲" : "▼";
      render();
    });
  });

  // --- Başlat + 10 sn'de bir otomatik yenile ---
  veriCek();
  setInterval(veriCek, 10000);
</script>
</body>
</html>
